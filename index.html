<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF4 提醒工具 - 第一階段測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 標題與操作列 -->
    <header class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">第一階段：畫面擷取排錯測試</h1>
        <p class="text-xs text-slate-400">測試 Video 與 Canvas 能否正常顯示畫面</p>
      </div>
      <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium text-sm transition">
        開始擷取畫面
      </button>
    </header>

    <!-- 狀態與除錯資訊 -->
    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-xs font-mono space-y-1 text-slate-300">
      <div>系統狀態：<span id="logStatus" class="text-amber-400">等待使用者開啟分享...</span></div>
      <div>畫面解析度：<span id="logResolution" class="text-sky-400">0 x 0</span></div>
    </div>

    <!-- 畫面比對區 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- 原生 Video 預覽 -->
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <span class="text-xs font-semibold text-slate-300">1. 原生 Video 標籤（直接串流）</span>
        <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center border border-slate-700">
          <video id="testVideo" class="w-full h-full object-contain" autoplay playsinline muted></video>
        </div>
      </div>

      <!-- Canvas 繪製預覽 -->
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <span class="text-xs font-semibold text-slate-300">2. Canvas 繪製畫面（後續分析用）</span>
        <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center border border-slate-700">
          <canvas id="testCanvas" class="w-full h-full object-contain"></canvas>
        </div>
      </div>

    </div>

  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('testVideo');
    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');
    
    const logStatus = document.getElementById('logStatus');
    const logResolution = document.getElementById('logResolution');

    let isRunning = false;

    startBtn.addEventListener('click', async () => {
      try {
        logStatus.textContent = '請求畫面授權中...';
        
        // 喚起瀏覽器畫面分享
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: false
        });

        video.srcObject = stream;

        // 當影片數據真正準備就緒時才開跑
        video.onloadeddata = () => {
          video.play();
          isRunning = true;

          // 設定 Canvas 正確解析度
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          logStatus.textContent = '畫面成功擷取並傳輸中！';
          logStatus.className = 'text-emerald-400';
          logResolution.textContent = `${video.videoWidth} x ${video.videoHeight}`;

          // 開啟 Canvas 渲染迴圈
          renderLoop();
        };

        // 監聽使用者停止分享
        stream.getVideoTracks()[0].onended = () => {
          isRunning = false;
          logStatus.textContent = '使用者已停止畫面分享';
          logStatus.className = 'text-amber-400';
        };

      } catch (err) {
        logStatus.textContent = '擷取失敗：' + err.message;
        logStatus.className = 'text-rose-400';
      }
    });

    // 持續將 Video 繪製到 Canvas
    function renderLoop() {
      if (!isRunning) return;

      if (video.readyState >= 2) { // 確保有畫面影格
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
