<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄羅斯釣魚4提示小助手 · 泰迪醬</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#3b2f6e;--mut:#7f74b4;--lav:#b7a6ff;--lav2:#e6dfff;--pink:#f08bc4;--sky:#8fd0ff;--mint:#2fc9a0;--gold:#ffcf5c;--glass:rgba(255,255,255,.66);--line:rgba(150,125,235,.5)}
*{box-sizing:border-box}
body{color:var(--ink);font-family:"Huninn","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;
 background:radial-gradient(900px 520px at 8% -8%,rgba(255,255,255,.85),transparent 62%),radial-gradient(800px 480px at 100% 4%,rgba(255,200,236,.7),transparent 60%),linear-gradient(165deg,#c9bdf8,#b7caf9 52%,#e4c8f3);background-attachment:fixed}
.spark{position:fixed;pointer-events:none;color:#fff;opacity:.7;z-index:0;text-shadow:0 0 10px rgba(255,255,255,.9)}
canvas{touch-action:none}
.bglogo{position:fixed;right:10px;bottom:8px;width:118px;height:auto;z-index:30;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,255,255,.85))}
.stage{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
@media(min-width:1024px){html,body{height:100%;overflow:hidden}}
@media(max-width:1023px){.stage{height:auto;container-type:normal}.stage .frame{width:100%!important}}
.soft-scroll{scrollbar-width:thin;scrollbar-color:#b7a6ff transparent}
.soft-scroll::-webkit-scrollbar{width:10px}.soft-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.35);border-radius:99px}
.soft-scroll::-webkit-scrollbar-thumb{background:linear-gradient(#b7a6ff,#f08bc4);border-radius:99px;border:2px solid rgba(255,255,255,.7)}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid rgba(255,255,255,.78);box-shadow:0 0 0 1px var(--line),0 10px 28px rgba(110,90,200,.18);border-radius:22px}
.soft{background:rgba(255,255,255,.62);border:1.5px solid var(--lav2);border-radius:16px}
.frame{border:5px solid var(--lav);border-radius:22px;background:#000;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 12px 30px rgba(90,70,180,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,filter .15s,background .15s;white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.field:focus-visible,.sw:focus-visible,.icon-btn:focus-visible,.meter:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn-primary{background:linear-gradient(135deg,#8b6cff,var(--pink));color:#fff;box-shadow:0 6px 16px rgba(139,108,255,.4)}.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:rgba(255,255,255,.75);border-color:var(--lav);color:#5b46b8}.btn-ghost:hover{background:#fff}
.btn-danger{background:#fff;border-color:#f6a6c0;color:#d9467e}.btn-danger:hover{background:#ffeef5}
.btn-sm{padding:6px 12px;font-size:12px}
.field{background:#fff;border:1.5px solid var(--lav2);border-radius:12px;color:var(--ink);padding:6px 10px;font-size:13px;font-family:inherit}
.field:focus{border-color:var(--lav);outline:none}
.lbl{font-size:12px;color:var(--mut)}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:17px;background:transparent;border:0}
.icon-btn:hover{background:rgba(255,255,255,.9)}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line),0 3px 8px rgba(0,0,0,.15);cursor:pointer;flex-shrink:0}
input.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:#d9d1f5;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .15s}
input.sw:checked{background:linear-gradient(135deg,#8b6cff,var(--pink))}input.sw:checked::after{transform:translateX(18px)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
input[type=range]{accent-color:#8b6cff}
.meter{position:relative;height:16px;margin-top:26px;cursor:pointer;--thr:70%}
.meter .track{position:absolute;inset:0;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,#fff 0,#fff var(--thr),rgba(240,139,196,.28) var(--thr));border:1.5px solid var(--lav)}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#b7a6ff,#d99cf0);border-radius:99px;transition:width .1s}
.meter.hit .fill{background:linear-gradient(90deg,#5fe0bd,#8fd0ff)}
.meter .knob{position:absolute;left:var(--thr);top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:4px solid var(--pink);box-shadow:0 3px 8px rgba(190,80,150,.4);cursor:grab}
.meter .knob b{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
.card-active{border-color:var(--rc)!important;box-shadow:0 0 0 3px var(--rc),0 12px 28px rgba(110,90,200,.3)}
details>summary{cursor:pointer;list-style:none;font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:space-between;padding:2px 0}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .arr{transform:rotate(180deg)}
.simnum{font-size:20px;font-weight:700;min-width:64px;text-align:right}
</style>
</head>

<div class="max-w-[1600px] mx-auto relative z-10 flex flex-col gap-4 p-3 md:p-5 lg:h-screen">
  <header class="glass px-5 py-3 shrink-0 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="min-w-0">
        <h1 class="text-lg md:text-xl font-bold flex flex-wrap items-center gap-2">俄羅斯釣魚4提示小助手
          <span id="liveChip" class="chip bg-white/80 text-[#7f74b4]">未擷取</span></h1>
        <p class="lbl mt-0.5">文字摳圖比對 · 抗背景與眩光 · 連續觸發靜音 · ZIP 設定同步</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button id="exportZipBtn" class="btn btn-ghost">匯出設定與音效包</button>
      <label class="btn btn-ghost">匯入設定包<input type="file" id="importZipInput" accept=".zip" class="hidden"></label>
      <button id="startBtn" class="btn btn-primary">開啟畫面分享</button>
    </div>
  </header>

  <video id="bgVideo" class="hidden" autoplay playsinline muted></video>

  <div class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_430px] xl:grid-cols-[minmax(0,1fr)_480px] lg:flex-1 lg:min-h-0 lg:grid-rows-[minmax(0,1fr)]">
    <section class="flex flex-col gap-3 lg:h-full lg:min-h-0">
      <div class="flex flex-wrap items-center justify-between gap-2 px-2 shrink-0">
        <h2 class="font-bold">遊戲畫面</h2>
        <div class="flex items-center gap-4 text-xs">
          <span id="currentEditingText" class="chip bg-white/80 text-[#5b46b8]">目前選取：規則 1</span>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="showOverlayToggle" checked class="sw">顯示監控框</label>
        </div>
      </div>
      <div class="stage"><div class="frame relative" style="aspect-ratio:16/9;width:min(100cqw,calc(100cqh*16/9))">
        <canvas id="mainCanvas" width="1280" height="720" class="w-full h-full object-contain"></canvas>
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-center px-6 text-white">
          <p class="font-bold text-lg">還沒有遊戲畫面 ✦</p>
          <p class="text-sm opacity-80">按右上角「開啟畫面分享」，選擇遊戲視窗就開始囉</p>
        </div>
      </div></div>
    </section>

    <section class="flex flex-col gap-3 lg:h-full lg:min-h-0">
      <div class="glass p-3 space-y-3 shrink-0">
        <div class="flex items-center justify-between">
          <h2 class="font-bold">規則總控</h2>
          <button id="addRuleBtn" class="btn btn-sm btn-primary">＋ 新增規則</button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button id="enableAllBtn" class="btn btn-sm btn-ghost">全部啟用</button>
          <button id="disableAllBtn" class="btn btn-sm btn-ghost">全部停用</button>
          <button id="unmuteAllBtn" class="btn btn-sm btn-ghost">解除全靜音</button>
        </div>
      </div>
      <div id="rulesContainer" class="space-y-3 p-1 pr-2 pb-3 lg:pb-24 lg:flex-1 lg:min-h-0 lg:overflow-y-auto soft-scroll"></div>
    </section>
  </div>

</div>

<!-- 顏色視窗 -->
<div id="colorModal" class="hidden fixed inset-0 bg-[#3b2f6e]/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="glass !bg-white/90 p-5 max-w-xs w-full space-y-4">
    <div class="flex justify-between items-center"><h3 class="font-bold">監控框顏色</h3><button id="closeColorModalX" class="icon-btn" aria-label="關閉">✕</button></div>
    <div class="flex items-center gap-3">
      <input type="color" id="modalColorPicker" class="w-14 h-14 bg-transparent cursor-pointer rounded shrink-0">
      <div id="modalColorPreview" class="flex-1 h-10 rounded-full border-2 border-white flex items-center justify-center text-xs font-mono font-bold text-white shadow">#F59E0B</div>
    </div>
    <div class="grid grid-cols-7 gap-2" id="colorPresetsContainer"></div>
    <div class="flex justify-end gap-2 pt-3 border-t border-[#e6dfff]"><button id="cancelColorBtn" class="btn btn-sm btn-ghost">取消</button><button id="confirmColorBtn" class="btn btn-sm btn-primary">確定</button></div>
  </div>
</div>

<!-- ROI 視窗 -->
<div id="cropModal" class="hidden fixed inset-0 bg-[#3b2f6e]/55 z-50 flex flex-col p-3 md:p-5 gap-3 backdrop-blur-sm">
  <div class="glass !bg-white/85 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div><h2 class="font-bold">調整監控範圍與摳字</h2>
      <p class="lbl">畫面已凍結。拖曳框選目標（盡量只框文字／圖示），粉紅色就是系統摳出來要比對的筆畫。方向鍵可微調，Esc 取消。</p></div>
    <div class="flex flex-wrap gap-2">
      <button id="resetCropBtn" class="btn btn-sm btn-danger">清空重選</button>
      <button id="cancelCropBtn" class="btn btn-sm btn-ghost">取消</button>
      <button id="saveRoiOnlyBtn" class="btn btn-sm btn-ghost" title="只改位置，保留原本的比對圖">只更新範圍</button>
      <button id="saveCropBtn" class="btn btn-sm btn-primary" title="範圍與比對圖都改成目前框選內容">更新範圍與比對圖</button>
    </div>
  </div>
  <div class="flex-1 grid gap-3 lg:grid-cols-[minmax(0,1fr)_310px] min-h-0">
    <div class="frame flex items-center justify-center min-h-[200px]"><canvas id="modalCanvas" class="max-w-full max-h-full cursor-crosshair"></canvas></div>
    <aside class="glass !bg-white/85 p-4 space-y-4 overflow-y-auto no-scrollbar">
      <div>
        <div class="lbl mb-1.5">摳字預覽（粉紅 = 比對用筆畫）</div>
        <div class="bg-black rounded-2xl min-h-[90px] flex items-center justify-center p-2 border-2 border-[#e6dfff]"><canvas id="modalPreviewCanvas" class="max-w-full max-h-[110px]"></canvas></div>
        <div class="flex items-center justify-between mt-3"><span class="lbl">摳字靈敏度</span><b id="sensVal" class="text-sm">45</b></div>
        <input type="range" id="sensRange" min="20" max="80" value="45" class="w-full">
        <p class="lbl text-[11px]">粉紅太少就往右、連背景也變粉紅就往左</p>
      </div>
      <div class="flex items-center justify-between"><span class="lbl">微調幅度</span>
        <select id="stepSel" class="field"><option value="0.001">細 0.1%</option><option value="0.002" selected>中 0.2%</option><option value="0.005">粗 0.5%</option></select></div>
      <div>
        <div class="text-xs font-bold text-[#8b6cff] mb-1.5">整體平移</div>
        <div class="grid grid-cols-3 gap-1.5 w-40 mx-auto">
          <span></span><button data-dir="move_up" class="nudge btn btn-sm btn-ghost">▲</button><span></span>
          <button data-dir="move_left" class="nudge btn btn-sm btn-ghost">◀</button><span class="flex items-center justify-center text-[#b7a6ff]">✦</span><button data-dir="move_right" class="nudge btn btn-sm btn-ghost">▶</button>
          <span></span><button data-dir="move_down" class="nudge btn btn-sm btn-ghost">▼</button><span></span>
        </div>
      </div>
      <div class="space-y-2">
        <div class="text-xs font-bold text-[#e0699f]">單邊縮放</div>
        <div class="grid grid-cols-[40px_1fr_1fr] gap-1.5 items-center">
          <span class="lbl">上緣</span><button data-dir="top_shrink" class="nudge btn btn-sm btn-ghost">▼ 縮小</button><button data-dir="top_expand" class="nudge btn btn-sm btn-ghost">▲ 擴大</button>
          <span class="lbl">下緣</span><button data-dir="bottom_shrink" class="nudge btn btn-sm btn-ghost">▲ 縮小</button><button data-dir="bottom_expand" class="nudge btn btn-sm btn-ghost">▼ 擴大</button>
          <span class="lbl">左緣</span><button data-dir="left_shrink" class="nudge btn btn-sm btn-ghost">▶ 縮小</button><button data-dir="left_expand" class="nudge btn btn-sm btn-ghost">◀ 擴大</button>
          <span class="lbl">右緣</span><button data-dir="right_shrink" class="nudge btn btn-sm btn-ghost">◀ 縮小</button><button data-dir="right_expand" class="nudge btn btn-sm btn-ghost">▶ 擴大</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $=id=>document.getElementById(id);
  const startBtn=$('startBtn'),video=$('bgVideo'),mainCanvas=$('mainCanvas'),ctx=mainCanvas.getContext('2d');
  const rulesContainer=$('rulesContainer'),currentEditingText=$('currentEditingText'),showOverlayToggle=$('showOverlayToggle');
  const cropModal=$('cropModal'),modalCanvas=$('modalCanvas'),modalCtx=modalCanvas.getContext('2d');
  const modalPreviewCanvas=$('modalPreviewCanvas'),modalPreviewCtx=modalPreviewCanvas.getContext('2d');
  const colorModal=$('colorModal'),modalColorPicker=$('modalColorPicker'),modalColorPreview=$('modalColorPreview');
  let isCapturing=false,isDragging=false,dragStart={x:0,y:0},snapshotImgData=null,tempRoi={x:.2,y:.85,w:.15,h:.08},tempSens=45;
  const defaultColors=['#f59e0b','#ef4444','#3b82f6','#10b981','#a855f7','#ec4899','#06b6d4'];
  let colorSelectingRuleId=null,pendingColor='#f59e0b';
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  /* ---------- 預設範本 ---------- */
  const mkImg=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#111827';x.fillRect(0,0,w,h);fn(x);return x.getImageData(0,0,w,h);};
  const defaultUncastImageData=mkImg(160,32,x=>{x.fillStyle='#d1d5db';x.font='bold 13px sans-serif';x.fillText('釣具準備好,可以拋竿一下',6,21);});
  const defaultFishImageData=mkImg(60,60,x=>{x.strokeStyle='#d1d5db';x.lineWidth=4;x.beginPath();x.arc(30,30,22,0,Math.PI*2);x.stroke();x.fillStyle='#d1d5db';
    x.beginPath();x.ellipse(33,30,9,5.5,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(24,25);x.lineTo(17,21);x.lineTo(17,39);x.lineTo(24,35);x.fill();});
  const makeRule=o=>({id:1,name:'規則',roi:{x:.2,y:.5,w:.1,h:.08},targetImageData:defaultUncastImageData,threshold:70,soundType:'beep2',customAudioUrl:null,customAudioFileName:null,
    color:'#f59e0b',enabled:true,cooldown:3.5,isCoolingDown:false,maxAlerts:3,currentAlerts:0,lastMatchTime:0,neverMute:false,isMuted:false,triggerAction:'none',currentSim:0,inkSens:45,_open:false,...o});
  let rules=[
    makeRule({id:1,name:'規則 1 (未拋竿提醒)',roi:{x:.18,y:.91,w:.12,h:.05},color:'#f59e0b'}),
    makeRule({id:2,name:'規則 2 (上魚提醒)',roi:{x:.92,y:.75,w:.06,h:.1},targetImageData:defaultFishImageData,soundType:'siren',color:'#ef4444',maxAlerts:5})];
  let activeRuleId=1;

  /* =====================================================
     摳字比對引擎
     存圖時：找出「比周圍更白」的筆畫像素 = ink，及緊貼筆畫外側一圈 = ring
     即時時：只在 ink / ring 位置取樣，比「筆畫 vs 外圈」的對比是否成立
     → 背景（泥土、天空、樹影）不在 ink 上，就不會影響分數
     ===================================================== */
  const SHIFT=2,MAXG=240;
  const scratch=document.createElement('canvas'),sctx=scratch.getContext('2d',{willReadFrequently:true});
  function grab(src,sx,sy,sw,sh,gw,gh){
    if(scratch.width!==gw||scratch.height!==gh){scratch.width=gw;scratch.height=gh;}
    sctx.imageSmoothingEnabled=true;sctx.imageSmoothingQuality='high';sctx.clearRect(0,0,gw,gh);sctx.drawImage(src,sx,sy,sw,sh,0,0,gw,gh);
    return sctx.getImageData(0,0,gw,gh);
  }
  // 白度：RGB 最小值。白/灰文字高，褐色泥土、藍天、綠樹都偏低
  function whiteness(d,n){const f=new Float32Array(n);for(let i=0;i<n;i++)f[i]=Math.min(d[i*4],d[i*4+1],d[i*4+2]);return f;}
  function boxBlur(f,w,h,r){
    const W=w+1,S=new Float64Array(W*(h+1)),o=new Float32Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)S[(y+1)*W+x+1]=f[y*w+x]+S[y*W+x+1]+S[(y+1)*W+x]-S[y*W+x];
    for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
      for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);o[y*w+x]=(S[y1*W+x1]-S[y0*W+x1]-S[y1*W+x0]+S[y0*W+x0])/((x1-x0)*(y1-y0));}}
    return o;
  }
  function dilate(m,w,h,k){
    const t=new Uint8Array(m.length),o=new Uint8Array(m.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let i=-k;i<=k&&!v;i++){const xx=x+i;if(xx>=0&&xx<w&&m[y*w+xx])v=1;}t[y*w+x]=v;}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let i=-k;i<=k&&!v;i++){const yy=y+i;if(yy>=0&&yy<h&&t[yy*w+x])v=1;}o[y*w+x]=v;}
    return o;
  }
  function buildTpl(img,sens){
    const w=img.width,h=img.height,n=w*h,f=whiteness(img.data,n);
    const bl=boxBlur(f,w,h,Math.min(6,Math.max(3,Math.round(h*.25)))),d=new Float32Array(n);
    for(let i=0;i<n;i++)d[i]=f[i]-bl[i];
    const pos=Array.from(d).filter(v=>v>0).sort((a,b)=>a-b);
    if(pos.length<8)return{valid:false,ink:[]};
    const p97=pos[Math.floor(pos.length*.97)],fs=Array.from(f).sort((a,b)=>a-b),f90=fs[Math.floor(n*.9)];
    let t=Math.max(8,p97*sens/100),ink=new Uint8Array(n),c=0;
    for(let i=0;i<n;i++)if(d[i]>t&&f[i]>=f90*.55){ink[i]=1;c++;}
    if(c<6){t=pos[Math.floor(pos.length*.94)];for(let i=0;i<n;i++)if(d[i]>=t){ink[i]=1;}}
    const d1=dilate(ink,w,h,1),d3=dilate(ink,w,h,3),I=[],R=[];
    for(let i=0;i<n;i++){if(ink[i])I.push(i);else if(d3[i]&&!d1[i])R.push(i);}
    if(I.length<4||R.length<4)return{valid:false,ink:I};
    let si=0,sr=0;I.forEach(i=>si+=f[i]);R.forEach(i=>sr+=f[i]);
    return{valid:true,w,h,ink:I,ix:Int16Array.from(I,i=>i%w),iy:Int16Array.from(I,i=>(i/w)|0),rx:Int16Array.from(R,i=>i%w),ry:Int16Array.from(R,i=>(i/w)|0),ct:si/I.length-sr/R.length};
  }
  function scoreAt(fl,w,h,T,dx,dy){
    const ni=T.ix.length,nr=T.rx.length;let ci=0,si=0,cr=0,sr=0;
    for(let k=0;k<ni;k++){const x=T.ix[k]+dx,y=T.iy[k]+dy;if(x>=0&&x<w&&y>=0&&y<h){si+=fl[y*w+x];ci++;}}
    for(let k=0;k<nr;k++){const x=T.rx[k]+dx,y=T.ry[k]+dy;if(x>=0&&x<w&&y>=0&&y<h){sr+=fl[y*w+x];cr++;}}
    if(ci<ni*.6||cr<nr*.6)return 0;
    const mi=si/ci,mr=sr/cr,C=mi-mr,cmin=Math.max(8,T.ct*.25);
    if(C<cmin*.5)return 0;
    const L=(mi+mr)/2;let hi=0,lo=0;
    for(let k=0;k<ni;k++){const x=T.ix[k]+dx,y=T.iy[k]+dy;if(x>=0&&x<w&&y>=0&&y<h&&fl[y*w+x]>L)hi++;}
    for(let k=0;k<nr;k++){const x=T.rx[k]+dx,y=T.ry[k]+dy;if(x>=0&&x<w&&y>=0&&y<h&&fl[y*w+x]<=L)lo++;}
    const acc=.5*(hi/ci+lo/cr);
    return Math.max(0,(acc-.5)*2)*Math.min(1,C/cmin)*100;
  }
  const imgToCanvas=id=>{const c=document.createElement('canvas');c.width=id.width;c.height=id.height;c.getContext('2d').putImageData(id,0,0);return c;};
  function getTpl(rule,gw,gh){
    if(rule._src!==rule.targetImageData){rule._src=rule.targetImageData;rule._tplCanvas=imgToCanvas(rule.targetImageData);rule._tc={};}
    const k=gw+'x'+gh+'|'+rule.inkSens;
    if(!rule._tc[k]){const c=rule._tplCanvas;rule._tc[k]=buildTpl(grab(c,0,0,c.width,c.height,gw,gh),rule.inkSens);}
    return rule._tc[k];
  }
  function evaluateRule(rule){
    const vw=video.videoWidth,vh=video.videoHeight,sx=Math.min(vw-1,Math.round(rule.roi.x*vw)),sy=Math.min(vh-1,Math.round(rule.roi.y*vh));
    const sw=Math.max(1,Math.min(vw-sx,Math.round(rule.roi.w*vw))),sh=Math.max(1,Math.min(vh-sy,Math.round(rule.roi.h*vh)));
    const s=Math.min(1,MAXG/Math.max(sw,sh)),gw=Math.max(8,Math.round(sw*s)),gh=Math.max(8,Math.round(sh*s));
    const T=getTpl(rule,gw,gh);if(!T.valid)return 0;
    const fl=whiteness(grab(video,sx,sy,sw,sh,gw,gh).data,gw*gh);
    let best=0;for(let dy=-SHIFT;dy<=SHIFT;dy++)for(let dx=-SHIFT;dx<=SHIFT;dx++)best=Math.max(best,scoreAt(fl,gw,gh,T,dx,dy));
    const hist=rule._hist||(rule._hist=[]);hist.push(best);if(hist.length>3)hist.shift();   // 3 幀中位數
    return[...hist].sort((a,b)=>a-b)[hist.length>>1];
  }
  function tintInk(cv,img){
    cv.width=img.width;cv.height=img.height;const c=cv.getContext('2d'),o=new ImageData(new Uint8ClampedArray(img.data),img.width,img.height),T=buildTpl(img,cv._sens||45);
    (T.ink||[]).forEach(i=>{o.data[i*4]=255;o.data[i*4+1]=61;o.data[i*4+2]=168;});c.putImageData(o,0,0);
  }

  /* ---------- 規則卡片 ---------- */
  function refreshStatus(r){
    const el=$('status_'+r.id);if(!el)return;
    el.innerHTML=(r.isCoolingDown?'<span class="chip bg-[#ffe3ef] text-[#d9467e] animate-pulse">冷卻中</span>':'')+(r.isMuted?`<span class="chip bg-[#fff1cc] text-[#a86b00]">已靜音（連續觸發 ${r.maxAlerts} 次）· 點鈴鐺解除</span>`:'');
    el.className=(r.isCoolingDown||r.isMuted)?'flex flex-wrap gap-1.5':'hidden';
    const b=$('mute_'+r.id);if(b)b.textContent=r.isMuted?'🔕':'🔔';
    const c=$('count_'+r.id);if(c)c.textContent=`${r.currentAlerts}/${r.maxAlerts}`;
  }
  function setState(r,txt,cls){const e=$('state_'+r.id);if(e&&e.textContent!==txt){e.textContent=txt;e.className='chip '+cls;}}
  const ST={on:'bg-[#d7f7ec] text-[#14906e]',idle:'bg-[#ece6ff] text-[#7f74b4]',off:'bg-[#eee] text-[#999]'};
  function markActive(){
    rulesContainer.querySelectorAll('[data-card]').forEach(c=>c.classList.toggle('card-active',+c.dataset.card===activeRuleId));
    const r=rules.find(x=>x.id===activeRuleId);currentEditingText.textContent=r?`目前選取：${r.name}`:'';
  }
  function setThr(r,v){r.threshold=v;const m=$('meter_'+r.id);if(!m)return;m.style.setProperty('--thr',v+'%');m.setAttribute('aria-valuenow',v);$('thr_'+r.id).textContent=v;}

  function renderRulesUI(){
    rulesContainer.innerHTML='';
    rules.forEach(r=>{
      const c=r.color||'#f59e0b',id=r.id;
      const links=rules.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${r.triggerAction==x.id?'selected':''}>解除：${esc(x.name)}</option>`).join('');
      const card=document.createElement('div');card.dataset.card=id;card.style.setProperty('--rc',c);
      card.className='glass p-4 space-y-3 transition-shadow'+(r.enabled?'':' opacity-60');
      card.innerHTML=`
        <div class="flex items-center gap-2">
          <button data-id="${id}" class="open-color-modal-btn dot" style="background:${c}" title="變更框線顏色" aria-label="變更框線顏色"></button>
          <input type="text" value="${esc(r.name)}" data-id="${id}" class="rule-name-input field flex-1 min-w-0 font-bold">
          <button data-id="${id}" id="mute_${id}" class="mute-toggle-btn icon-btn" title="切換靜音">${r.isMuted?'🔕':'🔔'}</button>
          <input type="checkbox" class="sw rule-enable-toggle" data-id="${id}" ${r.enabled?'checked':''} aria-label="啟用判斷" title="啟用/停用判斷">
          ${rules.length>1?`<button data-id="${id}" class="delete-rule-btn icon-btn text-[#d9467e]" title="刪除規則" aria-label="刪除規則">✕</button>`:''}
        </div>
        <div id="status_${id}" class="hidden"></div>
        <div class="soft p-2.5 flex items-center gap-3">
          <canvas id="targetCanvas_${id}" class="w-[72px] h-14 bg-black rounded-xl border-2 border-white shrink-0 object-contain" title="比對圖（粉紅為摳出的筆畫）"></canvas>
          <div class="flex-1 min-w-0 space-y-1">
            <button data-id="${id}" class="open-crop-modal-btn btn w-full" style="background:${c};color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)">調整監控範圍 / 摳字</button>
            <p class="lbl text-center text-[11px]">框選目標後自動摳出文字，只比對文字</p>
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between">
            <span class="lbl">相似度　<span class="text-[#e0699f]">拖曳圓點＝觸發門檻</span></span>
            <span class="flex items-center gap-2"><span id="state_${id}" class="chip ${ST.idle}">待機中</span><span class="lbl">連續 <b id="count_${id}" class="text-[#8b6cff]">${r.currentAlerts}/${r.maxAlerts}</b></span></span>
          </div>
          <div class="flex items-center gap-3">
            <div class="meter flex-1" id="meter_${id}" data-id="${id}" role="slider" tabindex="0" aria-label="觸發門檻" aria-valuemin="30" aria-valuemax="95" aria-valuenow="${r.threshold}" style="--thr:${r.threshold}%">
              <div class="track"><div class="fill" id="bar_${id}"></div></div>
              <div class="knob"><b><span id="thr_${id}">${r.threshold}</span>%</b></div>
            </div>
            <b id="sim_${id}" class="simnum text-[#8b6cff]">--</b>
          </div>
        </div>
        <details data-id="${id}" ${r._open?'open':''} class="pt-2 border-t border-[#e6dfff]">
          <summary><span>音效與觸發設定</span><span class="arr">▾</span></summary>
          <div class="space-y-3 pt-2">
            <div class="grid grid-cols-[1fr_auto_auto] gap-2 items-center">
              <select data-id="${id}" class="sound-select field">
                <option value="beep1" ${r.soundType==='beep1'?'selected':''}>低音嗶</option><option value="beep2" ${r.soundType==='beep2'?'selected':''}>高音嗶</option>
                <option value="siren" ${r.soundType==='siren'?'selected':''}>警報聲</option><option value="custom" ${r.soundType==='custom'?'selected':''}>自訂音效</option>
              </select>
              <label class="field flex items-center gap-1 !py-1" title="連續觸發幾次後進入靜音"><span class="lbl">連續</span><input type="number" min="1" max="99" value="${r.maxAlerts}" data-id="${id}" class="max-alerts-input bg-transparent text-[#e0699f] font-bold text-center w-7 outline-none"><span class="lbl">次靜音</span></label>
              <label class="field flex items-center gap-1 !py-1" title="觸發後的冷卻間隔"><span class="lbl">間隔</span><input type="number" min="0.5" max="60" step="0.5" value="${r.cooldown}" data-id="${id}" class="cooldown-number-input bg-transparent text-[#3b9be0] font-bold text-center w-8 outline-none"><span class="lbl">秒</span></label>
            </div>
            <div class="${r.soundType==='custom'?'':'hidden'}">
              <input type="file" accept="audio/*" data-id="${id}" class="custom-audio-input text-xs w-full file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-[#e6dfff] file:text-[#5b46b8]">
              ${r.customAudioFileName?`<p class="lbl mt-1">目前：${esc(r.customAudioFileName)}</p>`:''}
            </div>
            <div class="flex items-center justify-between text-xs"><span>達到次數後不自動靜音</span><input type="checkbox" class="sw never-mute-toggle" data-id="${id}" ${r.neverMute?'checked':''}></div>
            <div class="flex items-center justify-between gap-2 text-xs"><span class="shrink-0">觸發後解除靜音</span>
              <select data-id="${id}" class="action-select field min-w-0"><option value="none" ${r.triggerAction==='none'?'selected':''}>不連動</option><option value="all" ${r.triggerAction==='all'?'selected':''}>全部規則</option>${links}</select></div>
          </div>
        </details>`;
      rulesContainer.appendChild(card);
      const t=$('targetCanvas_'+id);if(r.targetImageData){t._sens=r.inkSens;tintInk(t,r.targetImageData);}
      refreshStatus(r);
    });
    markActive();
  }

  const ruleOf=t=>{const b=t.closest('[data-id]');return b?rules.find(x=>x.id===parseInt(b.dataset.id)):null;};
  let dragMeter=null;
  const thrFromEvent=(e,m)=>{const r=rules.find(x=>x.id==m.dataset.id),b=m.getBoundingClientRect();if(r)setThr(r,Math.round(Math.min(95,Math.max(30,(e.clientX-b.left)/b.width*100))));};
  rulesContainer.addEventListener('pointerdown',e=>{
    const card=e.target.closest('[data-card]');if(card&&+card.dataset.card!==activeRuleId){activeRuleId=+card.dataset.card;markActive();}
    const m=e.target.closest('.meter');if(m){dragMeter=m;m.setPointerCapture(e.pointerId);thrFromEvent(e,m);}
  });
  rulesContainer.addEventListener('pointermove',e=>{if(dragMeter)thrFromEvent(e,dragMeter);});
  ['pointerup','pointercancel'].forEach(n=>rulesContainer.addEventListener(n,()=>{dragMeter=null;}));
  rulesContainer.addEventListener('keydown',e=>{
    const m=e.target.closest('.meter');if(!m||!['ArrowLeft','ArrowRight'].includes(e.key))return;
    e.preventDefault();const r=rules.find(x=>x.id==m.dataset.id);setThr(r,Math.min(95,Math.max(30,r.threshold+(e.key==='ArrowRight'?1:-1))));
  });
  rulesContainer.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'){const r=ruleOf(e.target);if(r)r._open=e.target.open;}},true);

  rulesContainer.addEventListener('click',e=>{
    const t=e.target,r=ruleOf(t);if(!r)return;
    if(t.closest('.open-color-modal-btn')){colorSelectingRuleId=r.id;updateModalColorUI(r.color||'#f59e0b');colorModal.classList.remove('hidden');}
    else if(t.closest('.open-crop-modal-btn')){
      if(!isCapturing){alert('請先點擊頂部的「開啟畫面分享」並選擇遊戲視窗！');return;}
      activeRuleId=r.id;markActive();tempRoi={...r.roi};tempSens=r.inkSens;$('sensRange').value=tempSens;$('sensVal').textContent=tempSens;
      modalCanvas.width=video.videoWidth||mainCanvas.width;modalCanvas.height=video.videoHeight||mainCanvas.height;
      modalCtx.drawImage(video,0,0,modalCanvas.width,modalCanvas.height);snapshotImgData=modalCtx.getImageData(0,0,modalCanvas.width,modalCanvas.height);
      cropModal.classList.remove('hidden');renderModalCanvas();
    }
    else if(t.closest('.mute-toggle-btn')){r.isMuted=!r.isMuted;if(!r.isMuted)r.currentAlerts=0;refreshStatus(r);}
    else if(t.closest('.delete-rule-btn')){rules=rules.filter(x=>x.id!==r.id);if(activeRuleId===r.id&&rules.length)activeRuleId=rules[0].id;renderRulesUI();}
  });
  rulesContainer.addEventListener('input',e=>{
    const t=e.target,r=ruleOf(t);if(!r)return;
    if(t.classList.contains('rule-name-input')){r.name=t.value;markActive();}
    else if(t.classList.contains('cooldown-number-input')){const v=parseFloat(t.value);if(!isNaN(v))r.cooldown=Math.max(.5,v);}
    else if(t.classList.contains('max-alerts-input')){const v=parseInt(t.value);if(!isNaN(v)){r.maxAlerts=Math.max(1,v);refreshStatus(r);}}
  });
  rulesContainer.addEventListener('change',e=>{
    const t=e.target,r=ruleOf(t);if(!r)return;
    if(t.classList.contains('rule-enable-toggle')){r.enabled=t.checked;renderRulesUI();}
    else if(t.classList.contains('never-mute-toggle'))r.neverMute=t.checked;
    else if(t.classList.contains('sound-select')){r.soundType=t.value;r._open=true;renderRulesUI();}
    else if(t.classList.contains('action-select'))r.triggerAction=t.value;
    else if(t.classList.contains('custom-audio-input')){const f=t.files[0];if(f){r.customAudioUrl=URL.createObjectURL(f);r.customAudioFileName=f.name;r._open=true;renderRulesUI();}}
  });
  $('enableAllBtn').onclick=()=>{rules.forEach(r=>r.enabled=true);renderRulesUI();};
  $('disableAllBtn').onclick=()=>{rules.forEach(r=>r.enabled=false);renderRulesUI();};
  $('unmuteAllBtn').onclick=()=>{rules.forEach(r=>{r.isMuted=false;r.currentAlerts=0;refreshStatus(r);});};
  $('addRuleBtn').onclick=()=>{
    const id=rules.length?Math.max(...rules.map(x=>x.id))+1:1;
    rules.push(makeRule({id,name:`規則 ${id}`,color:defaultColors[(id-1)%defaultColors.length]}));activeRuleId=id;renderRulesUI();
    rulesContainer.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  /* ---------- 顏色視窗 ---------- */
  defaultColors.forEach(c=>{const b=document.createElement('button');b.className='w-7 h-7 rounded-full border-2 border-white shadow hover:scale-110 transition cursor-pointer';b.style.backgroundColor=c;b.setAttribute('aria-label',c);b.onclick=()=>updateModalColorUI(c);$('colorPresetsContainer').appendChild(b);});
  function updateModalColorUI(c){pendingColor=c;modalColorPicker.value=c;modalColorPreview.style.backgroundColor=c;modalColorPreview.textContent=c.toUpperCase();}
  modalColorPicker.addEventListener('input',e=>updateModalColorUI(e.target.value));
  const hideColorModal=()=>{colorModal.classList.add('hidden');colorSelectingRuleId=null;};
  $('cancelColorBtn').onclick=hideColorModal;$('closeColorModalX').onclick=hideColorModal;
  $('confirmColorBtn').onclick=()=>{const r=rules.find(x=>x.id===colorSelectingRuleId);if(r){r.color=pendingColor;renderRulesUI();}hideColorModal();};
  function hexToRgba(hex,a=.2){let c=(hex||'#f59e0b').replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

  /* ---------- ROI 視窗 ---------- */
  function renderModalCanvas(){
    if(!snapshotImgData)return;
    const W=modalCanvas.width,H=modalCanvas.height,rx=Math.round(tempRoi.x*W),ry=Math.round(tempRoi.y*H),rw=Math.round(tempRoi.w*W),rh=Math.round(tempRoi.h*H);
    modalCtx.putImageData(snapshotImgData,0,0);
    if(rw>0&&rh>0){const crop=modalCtx.getImageData(rx,ry,rw,rh);modalPreviewCanvas._sens=tempSens;tintInk(modalPreviewCanvas,crop);}
    const color=(rules.find(x=>x.id===activeRuleId)||{}).color||'#f59e0b';
    modalCtx.strokeStyle=color;modalCtx.lineWidth=Math.max(2,W/640);modalCtx.strokeRect(rx,ry,rw,rh);modalCtx.fillStyle=hexToRgba(color,.22);modalCtx.fillRect(rx,ry,rw,rh);
  }
  $('sensRange').addEventListener('input',e=>{tempSens=parseInt(e.target.value);$('sensVal').textContent=tempSens;renderModalCanvas();});
  function nudge(dir,s){
    const t=tempRoi,bak={...t};
    ({move_up:()=>t.y-=s,move_down:()=>t.y+=s,move_left:()=>t.x-=s,move_right:()=>t.x+=s,top_expand:()=>{t.y-=s;t.h+=s},top_shrink:()=>{t.y+=s;t.h-=s},
      bottom_expand:()=>t.h+=s,bottom_shrink:()=>t.h-=s,left_expand:()=>{t.x-=s;t.w+=s},left_shrink:()=>{t.x+=s;t.w-=s},right_expand:()=>t.w+=s,right_shrink:()=>t.w-=s})[dir]?.();
    if(t.w<.01||t.h<.01||t.x<0||t.y<0||t.x+t.w>1||t.y+t.h>1)Object.assign(t,bak);
    renderModalCanvas();
  }
  document.querySelectorAll('.nudge').forEach(b=>b.addEventListener('click',e=>nudge(e.currentTarget.dataset.dir,parseFloat($('stepSel').value))));
  document.addEventListener('keydown',e=>{
    if(cropModal.classList.contains('hidden'))return;
    if(e.key==='Escape'){cropModal.classList.add('hidden');return;}
    const m={ArrowUp:'move_up',ArrowDown:'move_down',ArrowLeft:'move_left',ArrowRight:'move_right'}[e.key];
    if(m&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();nudge(m,parseFloat($('stepSel').value));}
  });
  const modalPos=e=>{const r=modalCanvas.getBoundingClientRect();return{x:Math.max(0,Math.min(modalCanvas.width,(e.clientX-r.left)*modalCanvas.width/r.width)),y:Math.max(0,Math.min(modalCanvas.height,(e.clientY-r.top)*modalCanvas.height/r.height))};};
  modalCanvas.addEventListener('pointerdown',e=>{isDragging=true;modalCanvas.setPointerCapture(e.pointerId);dragStart=modalPos(e);Object.assign(tempRoi,{x:dragStart.x/modalCanvas.width,y:dragStart.y/modalCanvas.height,w:.001,h:.001});});
  modalCanvas.addEventListener('pointermove',e=>{
    if(!isDragging)return;const p=modalPos(e);
    tempRoi={x:Math.min(p.x,dragStart.x)/modalCanvas.width,y:Math.min(p.y,dragStart.y)/modalCanvas.height,w:Math.max(.01,Math.abs(p.x-dragStart.x)/modalCanvas.width),h:Math.max(.01,Math.abs(p.y-dragStart.y)/modalCanvas.height)};
    renderModalCanvas();
  });
  modalCanvas.addEventListener('pointerup',()=>{isDragging=false;});
  $('cancelCropBtn').onclick=()=>cropModal.classList.add('hidden');
  $('resetCropBtn').onclick=()=>{tempRoi={x:0,y:0,w:0,h:0};renderModalCanvas();};
  function resetRuleState(r){r.currentAlerts=0;r.lastMatchTime=0;r.isMuted=false;r._hist=[];r._tc={};r.inkSens=tempSens;}
  $('saveRoiOnlyBtn').onclick=()=>{const r=rules.find(x=>x.id===activeRuleId);if(r){r.roi={...tempRoi};resetRuleState(r);}cropModal.classList.add('hidden');renderRulesUI();};
  $('saveCropBtn').onclick=()=>{
    const r=rules.find(x=>x.id===activeRuleId);
    if(r){const W=modalCanvas.width,H=modalCanvas.height,rx=Math.round(tempRoi.x*W),ry=Math.round(tempRoi.y*H),rw=Math.round(tempRoi.w*W),rh=Math.round(tempRoi.h*H);
      if(rw>0&&rh>0){r.roi={...tempRoi};modalCtx.putImageData(snapshotImgData,0,0);r.targetImageData=modalCtx.getImageData(rx,ry,rw,rh);resetRuleState(r);}}
    cropModal.classList.add('hidden');renderRulesUI();
  };

  /* ---------- 匯出 / 匯入 ---------- */
  const b64ToImg=b64=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);res(x.getImageData(0,0,i.width,i.height));};i.src=b64;});
  $('exportZipBtn').onclick=async()=>{
    const zip=new JSZip(),keys=['id','name','roi','threshold','soundType','customAudioFileName','color','enabled','cooldown','maxAlerts','neverMute','triggerAction','inkSens'];
    zip.file('config.json',JSON.stringify(rules.map(r=>{const o={};keys.forEach(k=>o[k]=r[k]);o.targetImageBase64=r.targetImageData?imgToCanvas(r.targetImageData).toDataURL():null;return o;}),null,2));
    const af=zip.folder('audio');
    for(const r of rules)if(r.customAudioUrl&&r.customAudioFileName){try{af.file(r.customAudioFileName,await(await fetch(r.customAudioUrl)).blob());}catch(e){}}
    const url=URL.createObjectURL(await zip.generateAsync({type:'blob'})),a=document.createElement('a');
    a.href=url;a.download=`RF4_Alert_Config_${new Date().toISOString().slice(0,10)}.zip`;a.click();URL.revokeObjectURL(url);
  };
  $('importZipInput').addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const z=await new JSZip().loadAsync(file),cf=z.file('config.json');if(!cf){alert('壓縮檔內找不到 config.json 設定檔！');return;}
      const data=JSON.parse(await cf.async('text')),next=[];
      for(const it of data){
        let url=null;if(it.customAudioFileName){const af=z.file(`audio/${it.customAudioFileName}`);if(af)url=URL.createObjectURL(await af.async('blob'));}
        const{targetImageBase64,...rest}=it;
        next.push(makeRule({...rest,customAudioUrl:url,targetImageData:targetImageBase64?await b64ToImg(targetImageBase64):defaultUncastImageData,neverMute:it.neverMute||false,inkSens:it.inkSens||45}));
      }
      rules=next;if(rules.length)activeRuleId=rules[0].id;renderRulesUI();alert('設定與音效包匯入成功！');
    }catch(err){alert('匯入失敗，壓縮檔格式可能有誤：'+err.message);}
    e.target.value='';
  });

  /* ---------- 擷取與主迴圈 ---------- */
  startBtn.addEventListener('click',async()=>{
    if(!navigator.mediaDevices?.getDisplayMedia){alert('您的瀏覽器不支援畫面擷取 API！');return;}
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30}}});
      video.srcObject=stream;
      stream.getVideoTracks()[0].addEventListener('ended',()=>{isCapturing=false;$('emptyState').classList.remove('hidden');setLive(false);});
      video.onloadeddata=()=>{video.play();const was=isCapturing;isCapturing=true;mainCanvas.width=video.videoWidth;mainCanvas.height=video.videoHeight;$('emptyState').classList.add('hidden');setLive(true);if(!was)renderLoop();};
    }catch(err){if(err.name!=='NotAllowedError')alert('無法開啟畫面擷取：'+err.message);}
  });
  function setLive(on){const c=$('liveChip');c.textContent=on?'擷取中 ✦':'未擷取';c.className='chip '+(on?'bg-[#d7f7ec] text-[#14906e]':'bg-white/80 text-[#7f74b4]');startBtn.textContent=on?'重新選擇視窗':'開啟畫面分享';}

  function handleMatch(rule,sim,now){
    if(sim>=rule.threshold){
      rule.lastMatchTime=now;
      if(!rule.isCoolingDown&&!rule.isMuted){
        rule.currentAlerts++;refreshStatus(rule);
        if(rule.currentAlerts>=rule.maxAlerts&&!rule.neverMute){rule.isMuted=true;refreshStatus(rule);}else triggerAlert(rule);
      }
    }else if(rule.currentAlerts>0&&!rule.isMuted&&now-rule.lastMatchTime>3500){rule.currentAlerts=0;refreshStatus(rule);}
  }
  function renderLoop(){
    if(!isCapturing)return;
    if(video.readyState>=2){
      ctx.drawImage(video,0,0,mainCanvas.width,mainCanvas.height);const now=Date.now();
      rules.forEach(rule=>{
        if(!rule.enabled){setState(rule,'已停用',ST.off);return;}
        if(rule.roi.w<=0||rule.roi.h<=0||now-(rule._lastEval||0)<60)return;
        rule._lastEval=now;const sim=evaluateRule(rule);rule.currentSim=sim;
        const s=$('sim_'+rule.id),b=$('bar_'+rule.id),m=$('meter_'+rule.id);
        if(s)s.textContent=sim.toFixed(1)+'%';if(b)b.style.width=sim.toFixed(1)+'%';
        const hit=sim>=rule.threshold;if(m)m.classList.toggle('hit',hit);
        setState(rule,hit?'偵測到目標':'待機中',hit?ST.on:ST.idle);
        handleMatch(rule,sim,now);
      });
      if(cropModal.classList.contains('hidden')&&showOverlayToggle.checked){
        rules.forEach(rule=>{
          const act=rule.id===activeRuleId,col=rule.enabled?(rule.color||'#f59e0b'):'#9a96b8',k=Math.max(1,mainCanvas.width/1280);
          const rx=rule.roi.x*mainCanvas.width,ry=rule.roi.y*mainCanvas.height,rw=rule.roi.w*mainCanvas.width,rh=rule.roi.h*mainCanvas.height;
          ctx.strokeStyle=col;ctx.lineWidth=(act?3:1.5)*k;ctx.strokeRect(rx,ry,rw,rh);if(act){ctx.fillStyle=hexToRgba(col,.15);ctx.fillRect(rx,ry,rw,rh);}
        });
      }
    }
    requestAnimationFrame(renderLoop);
  }

  /* ---------- 警報 ---------- */
  let audioCtx=null;
  const endCooldown=rule=>setTimeout(()=>{rule.isCoolingDown=false;refreshStatus(rule);},rule.cooldown*1000);
  function triggerAlert(rule){
    rule.isCoolingDown=true;refreshStatus(rule);
    if(rule.soundType==='custom'&&rule.customAudioUrl){const a=new Audio(rule.customAudioUrl);a.play().catch(()=>{});a.onended=()=>endCooldown(rule);a.onerror=()=>endCooldown(rule);}
    else{
      let ms=300;
      try{
        audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume?.();
        const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.3,t);
        if(rule.soundType==='beep1'){o.frequency.setValueAtTime(600,t);o.start(t);o.stop(t+.3);}
        else if(rule.soundType==='beep2'){o.frequency.setValueAtTime(1000,t);o.frequency.setValueAtTime(1500,t+.1);o.start(t);o.stop(t+.3);}
        else{o.type='sawtooth';o.frequency.setValueAtTime(800,t);o.frequency.linearRampToValueAtTime(1600,t+.2);g.gain.setValueAtTime(.2,t);o.start(t);o.stop(t+.25);ms=250;}
      }catch(e){}
      setTimeout(()=>endCooldown(rule),ms);
    }
    if(rule.triggerAction!=='none'){
      (rule.triggerAction==='all'?rules.filter(r=>r.id!==rule.id):rules.filter(r=>r.id===parseInt(rule.triggerAction))).forEach(r=>{r.isMuted=false;r.currentAlerts=0;r.lastMatchTime=0;refreshStatus(r);});
    }
  }

  updateModalColorUI('#f59e0b');
  renderRulesUI();
});
</script>
</body>
</html>
