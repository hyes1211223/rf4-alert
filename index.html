<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF4 上魚提醒工具 (多條件晝夜防誤判版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    canvas { touch-action: none; cursor: crosshair; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-4">
    
    <!-- 頂部標題列 -->
    <header class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">🎣 RF4 多條件上魚警報系統</h1>
        <p class="text-xs text-slate-400">已啟用高對比黑白輪廓比對，自動無視晝夜天空與水面顏色干擾</p>
      </div>
      <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium text-sm transition">
        開啟畫面分享
      </button>
    </header>

    <!-- 隱藏串流 Video -->
    <video id="bgVideo" class="hidden" autoplay playsinline muted></video>

    <!-- 主工作區 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左側：遊戲主畫面 (占 7 欄) -->
      <div class="lg:col-span-7 bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center text-xs text-slate-300">
          <span class="font-semibold">遊戲主畫面（用滑鼠左鍵拖曳拉框）</span>
          <span id="currentEditingText" class="text-amber-400 font-medium">當前編輯：規則 1</span>
        </div>

        <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center border border-slate-700 relative">
          <canvas id="mainCanvas" class="w-full h-full object-contain"></canvas>
        </div>
        
        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 text-xs text-slate-300 space-y-1">
          <p class="text-amber-400 font-semibold">💡 精準辨識小技巧：</p>
          <p>1. 框選範圍<b>越小越精準</b>！請只框住「小魚圖示」或文字本身，不要把大片天空或海面框進去。</p>
          <p>2. 劃好框後，點擊右側卡片的 <b>📸 擷取當前框選為基準</b> 即可鎖定。</p>
        </div>
      </div>

      <!-- 右側：規則管理面板 (占 5 欄) -->
      <div class="lg:col-span-5 space-y-4">
        
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-200">監控規則清單</h2>
          <button id="addRuleBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium">
            ➕ 新增規則
          </button>
        </div>

        <!-- 卡片列表容器 -->
        <div id="rulesContainer" class="space-y-4 max-h-[600px] overflow-y-auto no-scrollbar pr-1">
          <!-- 動態生成規則卡片 -->
        </div>

      </div>

    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('bgVideo');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const rulesContainer = document.getElementById('rulesContainer');
    const addRuleBtn = document.getElementById('addRuleBtn');
    const currentEditingText = document.getElementById('currentEditingText');

    let isCapturing = false;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    
    // 規則資料結構
    let rules = [
      {
        id: 1,
        name: "規則 1 (上魚小圖示)",
        roi: { x: 0.25, y: 0.8, w: 0.12, h: 0.1 },
        targetImageData: null,
        threshold: 85,
        soundType: 'beep2',
        customAudioUrl: null,
        enabled: true,
        lastTrigger: 0,
        currentSim: 0
      }
    ];
    let activeRuleId = 1;

    function init() {
      renderRulesUI();
    }

    // 渲染 UI 卡片
    function renderRulesUI() {
      rulesContainer.innerHTML = '';

      rules.forEach(rule => {
        const isActive = rule.id === activeRuleId;
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition space-y-3 ${
          isActive ? 'bg-slate-800 border-amber-500/80 shadow-lg' : 'bg-slate-800/60 border-slate-700'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <input type="text" value="${rule.name}" data-id="${rule.id}" class="rule-name-input bg-slate-900 text-xs text-slate-200 border border-slate-700 px-2 py-1 rounded focus:outline-none focus:border-amber-500 w-2/3">
            <div class="flex items-center space-x-2">
              <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" ${rule.enabled ? 'checked' : ''} data-id="${rule.id}" class="rule-enable-toggle sr-only peer">
                <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-500 relative"></div>
              </label>
              ${rules.length > 1 ? `<button data-id="${rule.id}" class="delete-rule-btn text-rose-400 hover:text-rose-300 text-xs px-1">✕</button>` : ''}
            </div>
          </div>

          <div class="flex items-center space-x-3 bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/80">
            <canvas id="targetCanvas_${rule.id}" class="w-14 h-12 bg-black rounded border border-slate-700 object-contain shrink-0"></canvas>
            <div class="flex-1 space-y-1">
              <button data-id="${rule.id}" class="select-rule-btn text-xs w-full py-1 rounded font-medium transition ${
                isActive ? 'bg-amber-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'
              }">
                ${isActive ? '🎯 正在拖曳調整此框' : '點擊切換此框'}
              </button>
              <button data-id="${rule.id}" class="capture-btn text-xs w-full bg-blue-600 hover:bg-blue-500 text-white py-1 rounded transition">
                📸 擷取當前框選為基準
              </button>
            </div>
          </div>

          <div class="space-y-1">
            <div class="flex justify-between text-xs">
              <span class="text-slate-400">相似度門檻：<b>${rule.threshold}%</b></span>
              <span class="text-slate-300">目前相似度：<b class="sim-display" id="sim_${rule.id}">--%</b></span>
            </div>
            <input type="range" min="50" max="98" value="${rule.threshold}" data-id="${rule.id}" class="threshold-slider w-full h-1.5 bg-slate-700 rounded appearance-none cursor-pointer accent-emerald-500">
          </div>

          <div class="pt-2 border-t border-slate-700/60 flex flex-col space-y-2 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-slate-400">觸發音效：</span>
              <select data-id="${rule.id}" class="sound-select bg-slate-900 text-slate-200 border border-slate-700 rounded px-2 py-1">
                <option value="beep1" ${rule.soundType==='beep1'?'selected':''}>低音嗶嗶聲</option>
                <option value="beep2" ${rule.soundType==='beep2'?'selected':''}>高音提醒聲</option>
                <option value="siren" ${rule.soundType==='siren'?'selected':''}>警報急促音</option>
                <option value="custom" ${rule.soundType==='custom'?'selected':''}>📁 自訂 MP3/WAV 檔</option>
              </select>
            </div>

            <div id="customSoundArea_${rule.id}" class="${rule.soundType==='custom'?'':'hidden'} flex items-center space-x-2">
              <input type="file" accept="audio/*" data-id="${rule.id}" class="custom-audio-input text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
            </div>

            <button data-id="${rule.id}" class="test-sound-btn self-end text-[11px] text-amber-400 hover:underline">
              🔊 試聽此音效
            </button>
          </div>
        `;

        rulesContainer.appendChild(card);

        if (rule.targetImageData) {
          setTimeout(() => {
            const tCanvas = document.getElementById(`targetCanvas_${rule.id}`);
            if (tCanvas) {
              tCanvas.width = rule.targetImageData.width;
              tCanvas.height = rule.targetImageData.height;
              const tCtx = tCanvas.getContext('2d');
              tCtx.putImageData(rule.targetImageData, 0, 0);
            }
          }, 0);
        }
      });

      bindUIEvents();
    }

    function bindUIEvents() {
      document.querySelectorAll('.rule-name-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const id = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === id);
          if (r) r.name = e.target.value;
        });
      });

      document.querySelectorAll('.select-rule-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          activeRuleId = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === activeRuleId);
          currentEditingText.textContent = `當前編輯：${r.name}`;
          renderRulesUI();
        });
      });

      document.querySelectorAll('.capture-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === id);
          if (!r || !isCapturing) return;

          const rx = r.roi.x * mainCanvas.width;
          const ry = r.roi.y * mainCanvas.height;
          const rw = r.roi.w * mainCanvas.width;
          const rh = r.roi.h * mainCanvas.height;

          if (rw > 0 && rh > 0) {
            r.targetImageData = ctx.getImageData(rx, ry, rw, rh);
            renderRulesUI();
          }
        });
      });

      document.querySelectorAll('.threshold-slider').forEach(slider => {
        slider.addEventListener('input', (e) => {
          const id = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === id);
          if (r) r.threshold = parseInt(e.target.value);
          renderRulesUI();
        });
      });

      document.querySelectorAll('.rule-enable-toggle').forEach(toggle => {
        toggle.addEventListener('change', (e) => {
          const id = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === id);
          if (r) r.enabled = e.target.checked;
        });
      });

      document.querySelectorAll('.delete-rule-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.target.dataset.id);
          rules = rules.filter(x => x.id !== id);
          if (activeRuleId === id && rules.length > 0) activeRuleId = rules[0].id;
          renderRulesUI();
        });
      });

      document.querySelectorAll('.sound-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const id = parseInt(e.target.dataset.id);
          const r = rules.find(x => x.id === id);
          if (r) {
            r.soundType = e
