<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF4 上魚提醒工具 (修正版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    canvas { touch-action: none; cursor: crosshair; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 標題區 -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">🎣 RF4 上魚提醒工具</h1>
        <p class="text-xs text-slate-400">請在畫面上用滑鼠框選「上魚圖示」區域進行監控</p>
      </div>
      <div id="statusBadge" class="px-3 py-1 text-xs rounded-full bg-slate-700 text-slate-300">未開始擷取</div>
    </header>

    <!-- 主內容區 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 左側：視窗與框選 Canvas (占 2 欄) -->
      <div class="lg:col-span-2 bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-sm font-semibold text-slate-300">1. 畫面預覽（請在下方用滑鼠拖曳畫出紅框）</span>
          <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">
            開啟螢幕分享
          </button>
        </div>

        <!-- 畫布容器 -->
        <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
          <video id="videoElement" class="hidden" autoplay playsinline></video>
          <canvas id="mainCanvas" class="w-full h-full object-contain"></canvas>
        </div>
        <p class="text-xs text-amber-400">💡 提示：分享遊戲視窗後，請按住滑鼠左鍵在遊戲畫面左下角拉出一個框圈住「小魚圖示」。</p>
      </div>

      <!-- 右側：設定與狀態控制面板 (占 1 欄) -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-5">
        
        <!-- 步驟 2: 特徵擷取 -->
        <div class="space-y-2">
          <h2 class="text-sm font-semibold text-slate-300">2. 特徵設定</h2>
          <button id="captureTargetBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm py-2 rounded-lg font-medium transition disabled:opacity-50" disabled>
            📌 鎖定目前框選區域為目標特徵
          </button>
          
          <div class="flex items-center space-x-3 bg-slate-900 p-3 rounded-lg border border-slate-700">
            <span class="text-xs text-slate-400">鎖定的目標：</span>
            <canvas id="targetCanvas" class="w-16 h-16 bg-black rounded border border-slate-600 object-contain"></canvas>
            <div id="targetStatusText" class="text-xs text-slate-400">尚未設定目標</div>
          </div>
        </div>

        <!-- 步驟 3: 比對靈敏度與監控 -->
        <div class="space-y-4 pt-3 border-t border-slate-700">
          <h2 class="text-sm font-semibold text-slate-300">3. 比對與提醒設定</h2>
          
          <div>
            <div class="flex justify-between text-xs text-slate-300 mb-1">
              <span>相似度門檻：<b id="thresholdVal">80</b>%</span>
              <span>目前相似度：<b id="currentSimVal" class="text-emerald-400">-- %</b></span>
            </div>
            <input id="thresholdSlider" type="range" min="50" max="98" value="80" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
          </div>

          <!-- 警報總開關 -->
          <div class="flex items-center justify-between bg-slate-900 p-3 rounded-lg border border-slate-700">
            <span class="text-xs text-slate-300 font-medium">啟動自動警報</span>
            <input id="alarmToggle" type="checkbox" class="w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer" disabled>
          </div>

          <button id="testSoundBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 rounded-lg transition">
            🔊 測試警報音效
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    // DOM 元素引用
    const video = document.getElementById('videoElement');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const targetCanvas = document.getElementById('targetCanvas');
    const targetCtx = targetCanvas.getContext('2d');

    const startBtn = document.getElementById('startBtn');
    const captureTargetBtn = document.getElementById('captureTargetBtn');
    const statusBadge = document.getElementById('statusBadge');
    const targetStatusText = document.getElementById('targetStatusText');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdVal = document.getElementById('thresholdVal');
    const currentSimVal = document.getElementById('currentSimVal');
    const alarmToggle = document.getElementById('alarmToggle');
    const testSoundBtn = document.getElementById('testSoundBtn');

    // 狀態變數
    let isCapturing = false;
    let hasTarget = false;
    let targetImageData = null;
    let lastAlarmTime = 0;

    // 預設選框比例 (% 百分比)
    let roi = { x: 0.25, y: 0.82, w: 0.15, h: 0.12 }; //
